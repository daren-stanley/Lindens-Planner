<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}@media (prefers-reduced-motion:reduce){.sh .chev{transition:none}}

.fgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}

.fmain{display:flex;flex-direction:column;gap:10px;min-width:0}
.fplanbox{padding:0;overflow:hidden}

.selbar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:46px}
.selbar .dims{font-family:var(--mono);font-size:12px;color:var(--muted)}
.selbar .btn{padding:5px 9px}
.selbar .grp{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
#fcol{flex-basis:100%}

.srow{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.srow span{width:9.5em;font-size:12px;color:var(--muted)}
.swb{width:26px;height:26px;border-radius:5px;border:1px solid var(--line);cursor:pointer;padding:0}

.cgrp.shut .cits{display:none}
.cits{display:grid;grid-template-columns:1fr;gap:2px;padding:0 6px 6px}
.cit{display:flex;gap:8px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:3px 6px;cursor:grab;touch-action:pan-y}
.cit:hover{border-color:var(--line)}.cit svg{background:#FBFAF7;border-radius:4px;flex:none}
.cit span{display:flex;flex-direction:column;font-size:13px}.cit small{font-family:var(--mono);font-size:11px;color:var(--muted)}
body.dragging,body.dragging *{cursor:copy!important}</style></head><body>
<title>Lindens house picker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: drawing-office tool. Picker column (grouped by floor) on the left, live plans and running totals on the right. */
:root{
  --bg:#F3F2EE; --panel:#FFFFFF; --fg:#1E1D1A; --muted:#625E56; --line:#DAD6CC; --chip:#ECEAE4;
  --accent:#B9501C; --accent-soft:#F6E3D6; --accent-fg:#FFFFFF;
  --ok:#2C7A4B; --ok-soft:#E1F1E6; --warn:#946000; --warn-soft:#FBEFD6;
  --paper:#FFFFFF; --paper-line:#D9D5CB;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#191816; --panel:#22211E; --fg:#ECE9E2; --muted:#A39E93; --line:#3A3833; --chip:#2C2A26;
  --accent:#E07A45; --accent-soft:#3B2A1F; --accent-fg:#1A1310;
  --ok:#73C291; --ok-soft:#1F3328; --warn:#E3AF52; --warn-soft:#3A2F1A;
  --paper:#F4F2EC; --paper-line:#4A4741; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#191816; --panel:#22211E; --fg:#ECE9E2; --muted:#A39E93; --line:#3A3833; --chip:#2C2A26;
  --accent:#E07A45; --accent-soft:#3B2A1F; --accent-fg:#1A1310;
  --ok:#73C291; --ok-soft:#1F3328; --warn:#E3AF52; --warn-soft:#3A2F1A;
  --paper:#F4F2EC; --paper-line:#4A4741; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
h1,h2,h3{margin:0;text-wrap:balance}
button,select,input{font:inherit;color:inherit}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;max-width:1500px;margin:0 auto 16px}
.top h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
body.sbhide .layout{grid-template-columns:minmax(0,1fr)}
body.sbhide .side{display:none}
.sumline{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:baseline;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;text-align:left;font-family:var(--mono);font-size:12px;color:var(--muted)}
.sumline b{color:var(--fg);font-weight:500}
.cards{display:flex;flex-direction:column;gap:8px}
.rsj{pointer-events:none}
body.nosteel .rsj{display:none}
.legend label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
:root[data-theme="light"]{color-scheme:light}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.inp{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 10px;font-family:var(--mono);font-size:13px;width:15.5em;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.slots{display:flex;flex-direction:column;gap:12px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.group.fit{border-color:var(--accent)}
.gh{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:transparent;border:0;padding:11px 14px;cursor:pointer;text-align:left}
.gh .gn{font-weight:600;font-size:15px}
.gh .gs{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.gh .gs.done{color:var(--ok)}
.gsum{padding:0 14px 11px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:-4px}
.gbody{border-top:1px solid var(--line)}
.slot{border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.sh{width:100%;display:grid;grid-template-columns:1fr auto 14px;gap:8px;align-items:baseline;background:transparent;border:0;padding:9px 14px;cursor:pointer;text-align:left}
.sh .sn{font-weight:500}
.sh .sv{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.sh .sv.picked{color:var(--accent)}
.sh .sv.forced{color:var(--ok)}
.sh .chev{font-size:11px;color:var(--muted);transition:transform .15s}
.slot.open .chev{transform:rotate(90deg)}
.slot.open{background:color-mix(in srgb,var(--bg) 45%,var(--panel))}
.opts{display:flex;flex-direction:column;gap:5px;padding:0 12px 12px}
.opt{display:grid;grid-template-columns:40px 1fr auto;gap:2px 8px;align-items:baseline;text-align:left;border:1px solid var(--line);
  background:var(--panel);border-radius:6px;padding:6px 8px;cursor:pointer}
.opt .id{font-family:var(--mono);font-size:12px;color:var(--muted)}
.opt .nm{font-weight:500}
.opt .ds{grid-column:2 / 3;font-size:12px;color:var(--muted)}
.cost{grid-column:3;justify-self:end;align-self:end;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--accent);letter-spacing:.02em;white-space:nowrap}
.cost.save{color:var(--ok)}
.cost .stl{color:var(--muted);font-weight:400;font-size:10px;margin-right:6px;letter-spacing:0}
.opt.off .cost{color:var(--muted)}
.sh .sv .cost{margin-left:6px;font-size:11px}
.opt .tag{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.opt .tag.drawn{color:var(--ok)}
.opt:hover{border-color:var(--muted)}
.opt.on{background:var(--accent-soft);border-color:var(--accent)}
.opt.on .id,.opt.on .tag{color:var(--accent)}
.opt.sug{border-style:dashed}
.opt.off{opacity:.42;cursor:not-allowed}
.done{padding:0 12px 12px;display:flex;justify-content:flex-end}
.opt .tag.resets{color:var(--warn)}
.why{margin:2px 12px 12px;font-size:12px;color:var(--warn)}
.why:empty{display:none}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-family:var(--mono);font-size:12px;border-radius:999px;padding:4px 10px;background:var(--chip)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.codebox{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:10px 12px}
.codebox .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.codebox code{font-family:var(--mono);font-size:16px;font-weight:500;letter-spacing:.04em;user-select:all;overflow-wrap:anywhere}
.codebox .note{flex-basis:100%}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.card .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card .v{font-size:20px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.card ul{margin:4px 0 0;padding-left:16px;font-size:12px;color:var(--muted)}
.plans{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.plan{background:var(--paper);border:1px solid var(--paper-line);border-radius:8px;padding:10px 12px;overflow-x:auto}
.plan h2{font-size:13px;font-weight:600;color:#1E1D1A;margin-bottom:4px}
.plan svg{display:block;width:100%;height:auto;min-width:420px}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
@media (max-width:520px){.duo{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:22px;height:10px;border-radius:2px}
.note{font-size:12px;color:var(--muted);max-width:80ch;margin:0}
.msg{font-size:12px;color:var(--warn);flex-basis:100%;text-align:right}
.msg:empty{display:none}
@media (prefers-reduced-motion:reduce){.sh .chev{transition:none}}
</style>
<script>try{var _t=localStorage.getItem('lindens-theme');if(_t==='light'||_t==='dark')document.documentElement.dataset.theme=_t}catch(e){}</script>

<div class="top">
  <div>
    <h1>Lindens house picker <small id="appVer" style="font-size:.5em;font-weight:500;opacity:.6;letter-spacing:0">v33 · 14 Nov 2026</small></h1>
    <nav class="ptabs" aria-label="Pages"><button type="button" class="btn" data-page="1" aria-pressed="true">1 · Structure</button><button type="button" class="btn" data-page="2" aria-pressed="false">2 · Fittings</button></nav>
    <script>/* bump APP_VERSION on every release */ var APP_VERSION='v33';document.title='Lindens house picker '+APP_VERSION;</script>
  </div>
  <div class="actions">
    <select id="theme" class="btn" aria-label="Colour theme"><option value="auto">Theme: auto</option><option value="light">Theme: light</option><option value="dark">Theme: dark</option></select>
    <button id="sb" class="btn" type="button" aria-pressed="false">Hide options</button>
    <select id="preset" class="btn" aria-label="Start from a drawn board">
      <option value="">Start from a board…</option>
    </select>
    <input id="codeIn" class="inp" placeholder="Paste a code or link, e.g. LND-…" aria-label="Rebuild code">
    <button id="load" class="btn" type="button">Load</button>
    <button id="orig" class="btn" type="button" title="Pick every part as it is today">Original house</button>
    <button id="dl" class="btn" type="button" title="One image with all three floors at the same scale">Download plans</button>
    <button id="fill" class="btn primary" type="button">Fill the rest</button>
    <button id="clear" class="btn" type="button">Clear</button>
    <p class="msg" id="msg" role="status"></p>
  </div>
</div>

<div class="layout">
  <aside class="side" aria-label="House parts"><div class="slots" id="slots"></div><div id="sumwrap"></div></aside>
  <main class="main">
    <div class="status" id="status"></div>
    <div id="code"></div>
    <div class="plans">
      <section class="plan"><h2>Ground floor</h2><div id="pGF"></div></section>
      <div class="duo">
        <section class="plan"><h2>First floor</h2><div id="pFF"></div></section>
        <section class="plan"><h2>Loft</h2><div id="pLO"></div></section>
      </div>
    </div>
    <div class="legend">
      <span><i class="sw" style="background:#7FB2DD"></i>Existing window</span>
      <span><i class="sw" style="background:#E06D2B"></i>New or enlarged opening</span>
      <span><i class="sw" style="background:#2F78B5"></i>Glazing or fire screen</span>
      <span><i class="sw" style="background:#A8481A;height:4px"></i>Walking line, arrow points up</span>
      <span><i class="sw" style="background:#1FA35B;height:5px"></i>Steel (RSJ) over a removed wall or new opening</span>
      <span><i class="sw" style="background:#E8E4DA;opacity:.6"></i>Faded = not picked yet</span>
      <label><input type="checkbox" id="tsl" checked> Show steels</label>
    </div>
  </main>
</div>
<div id="fitPage">
  <div class="fbar">
    <span class="seg"><button type="button" class="btn" data-ff="0">Ground</button><button type="button" class="btn" data-ff="1">First</button><button type="button" class="btn" data-ff="2">Loft</button></span>
    <select id="fimp" class="btn" aria-label="Add a ready-made layout"></select>
    <span class="seg"><button type="button" class="btn" data-z="out" aria-label="Zoom out">−</button><button type="button" class="btn" data-z="in" aria-label="Zoom in">+</button><button type="button" class="btn" data-z="fit">Fit</button></span>
    <button type="button" class="btn" data-z="snap" aria-pressed="true">Snap: on</button>
    <button type="button" class="btn" data-z="clr">Clear floor</button>
  </div>
  <div class="fgrid">
    <div class="fmain"><div id="fsel" class="selbar"></div><div class="plan fplanbox"><div id="fplan"></div></div><div id="fcode" class="codebox"></div></div>
    <aside id="fpal" aria-label="Fittings"></aside>
  </div>
</div>

  const ens={M1:'2.7 × 1.3 m',M2:'2.2 × 1.8 m',M3:'2.2 × 1.8 m',M4:'2.2 × 1.7 m, through the dressing room',M5:'2.7 × 1.7 m, through the dressing room',M7:'1.5 × 2.5 m',M8:'2.7 × 2.2 m (loft)'}[c.M];
  const wc={W0:'1.7 × 2.4 m cloakroom',W1:'shared with the utility',W2:'0.8 × 1.4 m',W3:'1.8 × 1.4 m',W4:'1.8 × 1.4 m, off the back lobby',W5:'1.7 × 2.4 m, off the utility, no window',W6:'1.8 × 1.4 m',W7:'1.7 × 2.4 m with coats',W8:'1.7 × 1.2 m',W9:'1.7 × 0.8 m, floor 1 step up'}[c.W];
  const fs=s=>c._fit&&LBY[c[s]]?' · '+LBY[c[s]].sum:'';

  const dorm={LO4:'about 8.3 m',LO6:'about 8.3 m',LO8:'about 7.7 m',LO9:'about 7.7 m'}[c.LO]||'full width, about 10.6 m';
  const plan=[]; if(c.P!=='P0') plan.push('Porch over 3 m²: planning needed'); if(c.LO!=='LO0') plan.push(`Rear dormer ${dorm}: usually permitted development`);
  if(c.LO==='LO4') plan.push('Balcony: full planning needed');

  if(openP(c)) plan.push('Porch opened to the hall: it becomes part of the house, the porch door is the front door');

  if(c._fit&&inn(c.FP,['FP2','FP3','FP4'])) plan.push('Three-sided fire: flue route up through the first floor to confirm (Building Regs Part J)');

const TIERS=(()=>{ /* cost quartiles from 20,000 houses drawn evenly at random (fixed seed) */
  const v=[], byG=[], byF=[]; let r=12345; const rnd=()=>(r=(r*1103515245+12345)%2147483648)/2147483648;
  for(let s=0;s<16;s++){ byG.push([]); byF.push([]); }

  const wS=byG.map((g,s)=>g.length*byF[s].length), tot=wS.reduce((a,b)=>a+b,0);
  for(let k=0;k<20000;k++){ let x=rnd()*tot, s=0; while(x>=wS[s]){ x-=wS[s]; s++; }
    const c=comboOf(byG[s][Math.floor(rnd()*byG[s].length)],byF[s][Math.floor(rnd()*byF[s].length)]); v.push(STRUCT.reduce((a,t)=>a+costOf(c[t],c),0)); }
  v.sort((a,b)=>a-b);
  return [.25,.5,.75].map(q=>v[Math.floor(q*(v.length-1))]+.3);})();

$('orig').addEventListener('click',()=>{ $('msg').textContent=''; applyPicks(Object.assign({},DRAWN.find(d=>d[0]==='0')[1]),true); });
function composeSvg(){
  const st=state(), c=st.c, isPicked=s=>!!picks[s]||(!SLOTS[s].fit&&st.av[s].size===1);
  const P=40, G=40, T=160, gb=gfBox(c), GH=gb.h, W=P*2+2400+G, H=T+GH+G+800+P;
  const put=(f,vb,x,y,w,h,id)=>floorSvg(f,c,isPicked,vb,id).replace('<svg viewBox="'+vb+'"',`<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${vb}"`);
  const lab=(x,y,t)=>`<text x="${x}" y="${y}" font-size="30" font-weight="600" fill="#1E1D1A">${t}</text>`;
  let body=put(0,gb.vb,P,T,1620,GH,'G')+put(1,'-30 -60 1200 800',P,T+GH+G,1200,800,'F')+put(2,'-30 -60 1200 720',P+1200+G,T+GH+G,1200,720,'L');
  if(document.body.classList.contains('nosteel')) body=body.replace(/<line class="rsj"[^>]*>/g,'');
  const code=st.complete?makeCode(c):'incomplete house';
  const sx=P+1200+G+40, sy=T+GH+G+780;
  const bar=`<g><rect x="${sx}" y="${sy}" width="200" height="10" fill="#1E1D1A"/><rect x="${sx+100}" y="${sy}" width="100" height="10" fill="#fff" stroke="#1E1D1A" stroke-width="2"/><text x="${sx}" y="${sy+32}" font-size="22" fill="#1E1D1A">0</text><text x="${sx+200}" y="${sy+32}" font-size="22" text-anchor="end" fill="#1E1D1A">2 m</text></g>`;
  return {W,H,svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="IBM Plex Sans, Arial, sans-serif"><rect width="${W}" height="${H}" fill="#FFFFFF"/>`+
   `<text x="${P}" y="52" font-size="40" font-weight="600" fill="#1E1D1A">Lindens plans</text><text x="${P}" y="92" font-size="26" fill="#625E56">Rebuild code ${code} · all floors at the same scale, garden at the top</text>`+
   lab(P,T-20,'Ground floor')+lab(P,T+GH+G-12,'First floor')+lab(P+1200+G,T+GH+G-12,'Loft')+body+bar+`</svg>`};
}
$('dl').addEventListener('click',async()=>{
  const {W,H,svg}=composeSvg(), msg=$('msg');
  try{
    const img=new Image(); await new Promise((ok,no)=>{ img.onload=ok; img.onerror=()=>no(new Error('render')); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); });
    const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,W,H); g.drawImage(img,0,0);
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    const name='lindens-plans-'+(state().complete?makeCode(state().c).slice(4,16):'draft')+'.png';
    let dls=null; try{ dls=window.claude&&await claude.use('downloads'); }catch(e){}
    if(dls){ await dls.save({filename:name,data:blob}); msg.textContent=''; }
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
  }catch(e){ if(e&&e.code==='declined') return; msg.textContent='Couldn’t save the image here.'; }
});
$('clear').addEventListener('click',()=>{ $('msg').textContent=''; applyPicks({},false); });
$('load').addEventListener('click',()=>{
  let raw=$('codeIn').value.trim(); if(raw.includes('#')) raw=decodeURIComponent(raw.slice(raw.indexOf('#')+1));
  const [sc,fc]=raw.split('~'), p=readCode(sc), fi=fc!=null?readFit(fc):undefined;
  if(!p||fi===null){ $('msg').textContent='That code doesn’t match a house this picker can build.'; return; }
  $('msg').textContent=''; $('codeIn').value=''; applyPicks(p,true,fi);
});
$('codeIn').addEventListener('keydown',e=>{ if(e.key==='Enter') $('load').click(); });
const ps=$('preset'); DRAWN.forEach(([n])=>{const o=document.createElement('option');o.value=n;o.textContent=n==='0'?'Original house':n;ps.appendChild(o);});
ps.addEventListener('change',()=>{const d=DRAWN.find(([n])=>n===ps.value); if(d) applyPicks(Object.assign({},d[1]),true,d[2]?readFit(d[2]):undefined); ps.value='';});


/* ---------- page 2 controller ---------- */
const FLOORS=['Ground floor','First floor','Loft'];
let FVB={}, CLASH=new Set();
function floorBox(c,f){ return f===0?gfBox(c).vb:f===1?'-30 -60 1200 800':'-30 -60 1200 720'; }
function fitShare(){ const st=state(); return st.complete?makeCode(st.c)+(ITEMS.length?'~'+fitCode(ITEMS):''):''; }
function syncHash(){ const h=fitShare(); try{ if(h) history.replaceState(null,'','#'+h); }catch(e){} }
function setPage(p){
  const st=state(); if(p===2&&!st.complete){ $('msg').textContent='Finish the structure first: every part on page 1 needs a pick.'; p=1; }
  PAGE=p; document.body.classList.toggle('p2',p===2);
  document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.page===p));
  try{ localStorage.setItem('lindens-page',String(p)); }catch(e){}
  if(p===2) renderFit(true); else render();
}
function renderFit(full){
  const st=state(); if(!st.complete) return setPage(1);
  const c=st.c; buildGrid(c);
  if(full){
    document.querySelectorAll('[data-ff]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.ff===FFLOOR));
    const vb=FVB[FFLOOR]||floorBox(c,FFLOOR);
    let svg=floorSvg(FFLOOR,c,()=>true,vb,'X',true);
    const [,,vw,vh]=floorBox(c,FFLOOR).split(' ').map(Number); LASTHB=hasBed(FFLOOR);
    svg=svg.replace('<svg ',`<svg id="fsvg" style="aspect-ratio:${vw}/${vh}" `).replace(/<\/svg>\s*$/,'<g id="fitG"></g></svg>');
    $('fplan').innerHTML=svg;
    /* ready-made layouts for this house */
    const opts=LAYSLOTS.map(s=>[s,layoutOpts(s,c).filter(l=>l.ok(c))]).filter(([s,o])=>o.length);
    $('fimp').innerHTML='<option value="">Add a ready-made layout…</option>'+opts.map(([s,o])=>`<optgroup label="${SLOTS[s].name}">${o.map(l=>`<option value="${l.id}">${l.id} ${esc(l.name)}</option>`).join('')}</optgroup>`).join('');
  }
  drawItems(); selBar(); codeBar();
}
let LASTHB=null; const hasBed=f=>onFloor(f).some(([it])=>CAT[it.t][6]==='bed');
function drawItems(){
  const g=$('fitG'); if(!g) return;
  if(hasBed(FFLOOR)!==LASTHB) return renderFit(true);
  CLASH=clashes(FFLOOR);
  g.innerHTML=onFloor(FFLOOR).sort((a,b)=>(has(b[0].t,'f')-has(a[0].t,'f'))||(has(a[0].t,'t')-has(b[0].t,'t'))||(a[0]===SEL)-(b[0]===SEL))
    .map(([it,i])=>itemSvg(it,i,(it===SEL?'sel ':'')+(CLASH.has(i)?'clash':''))).join('');
}
function codeBar(){
  const n=ITEMS.length, nc=[0,1,2].reduce((a,f)=>a+clashes(f).size,0);
  $('fcode').innerHTML=`<span class="k">Fittings</span><span class="pill">${n} item${n===1?'':'s'}</span>${nc?`<span class="pill warn">${nc} clash${nc===1?'':'es'}</span>`:n?'<span class="pill ok">No clashes</span>':''}
   <button class="btn primary" type="button" id="fshare">Copy share link</button><span class="note" id="fmsg">The link carries the structure code and the fittings together. Fittings code: <code style="font-size:12px">${n?fitCode(ITEMS):'none yet'}</code></span>`;
}
function selBar(){
  const it=SEL, b=$('fsel');
  if(!it){ b.innerHTML=`<span class="note">Tap a fitting in the list to add it, or drag it onto the plan. Drag items to move them; they jump flush to a wall when they get close. Drag empty floor to pan, pinch or use + and − to zoom.</span>`; return; }
  const C=CAT[it.t], [w,d]=isz(it), z=has(it.t,'z');
  const sw=it.col||DEFCOL[C[6]]||'#FFFFFF';
  b.innerHTML=`<b>${esc(C[2])}</b><span class="dims">${w} × ${d} × ${C[5]} cm</span>
   <button class="btn" data-a="rl" title="Rotate 90° anticlockwise">⟲ 90°</button><button class="btn" data-a="rr" title="Rotate 90° clockwise">⟳ 90°</button><button class="btn" data-a="r15" title="Rotate 15°">⟳ 15°</button>
   ${z?`<span class="grp">W <button class="btn" data-a="w-">−</button><button class="btn" data-a="w+">+</button> D <button class="btn" data-a="d-">−</button><button class="btn" data-a="d+">+</button></span>`:''}
   <button class="btn" data-a="col"><i class="sw" style="background:${sw};border:1px solid var(--line)"></i> Colour</button>
   <button class="btn" data-a="dup">Duplicate</button><button class="btn" data-a="del">Delete</button>
   <div id="fcol" hidden></div>`;
}
function colPanel(){
  const it=SEL; if(!it) return '';
  return `<div class="colp">${SCHEMES.map(([n,hs])=>`<div class="srow"><span>${n}</span>${hs.split(' ').map(h=>`<button class="swb" data-col="#${h}" title="#${h}" style="background:#${h}"></button>`).join('')}</div>`).join('')}
   <div class="srow"><input class="inp" id="fhex" placeholder="#RRGGBB" value="${it.col||''}" style="width:9em"><button class="btn" data-a="hex">Use hex</button><button class="btn" data-a="nocol">Default colour</button></div></div>`;
}
function addItem(t,x,y){
  const st=state(), c=st.c, vb=($('fsvg')||{}).viewBox;
  if(x==null){ const v=vb&&vb.baseVal; x=v?v.x+v.width/2:555; y=v?v.y+v.height/2:331; }
  const it={t,f:FFLOOR,x,y,r:0}; ITEMS.push(it); place(it,x,y); SEL=it; saveFit(); syncHash(); drawItems(); selBar(); codeBar();
}
function svgPt(ev){ const s=$('fsvg'); const p=s.createSVGPoint(); p.x=ev.clientX; p.y=ev.clientY; return p.matrixTransform(s.getScreenCTM().inverse()); }
function setVb(v){ FVB[FFLOOR]=v.map(n=>Math.round(n*10)/10).join(' '); const s=$('fsvg'); if(s) s.setAttribute('viewBox',FVB[FFLOOR]); }
function getVb(){ return (FVB[FFLOOR]||floorBox(state().c,FFLOOR)).split(/\s+/).map(Number); }
function zoom(k,cx,cy){ const [x,y,w,h]=getVb(); if(cx==null){cx=x+w/2;cy=y+h/2;} const nw=Math.min(Math.max(w*k,150),2400), r=nw/w; setVb([cx-(cx-x)*r,cy-(cy-y)*r,nw,h*r]); }

/* ---------- events ---------- */
(function(){
  const P=new Map(); let drag=null, pan=null, pinch=null;
  $('fplan').addEventListener('pointerdown',ev=>{
    const s=$('fsvg'); if(!s) return;
    P.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(P.size===2){ drag=null; pan=null; const [a,b]=[...P.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),vb:getVb()}; return; }
    const g=ev.target.closest('g.fit');
    s.setPointerCapture(ev.pointerId);
    if(g){ const it=ITEMS[+g.dataset.i]; const p=svgPt(ev); SEL=it; drag={it,ox:p.x-it.x,oy:p.y-it.y,sx:ev.clientX,sy:ev.clientY,moved:false}; drawItems(); selBar(); }
    else { pan={sx:ev.clientX,sy:ev.clientY,vb:getVb(),m:s.getScreenCTM().a,moved:false}; }
  });
  $('fplan').addEventListener('pointermove',ev=>{
    if(!P.has(ev.pointerId)) return; P.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(pinch&&P.size===2){ const [a,b]=[...P.values()], dd=Math.hypot(a.x-b.x,a.y-b.y); if(dd<10) return;
      const [x,y,w,h]=pinch.vb, k=pinch.d/dd, nw=Math.min(Math.max(w*k,150),2400), r=nw/w; setVb([x+w/2-nw/2,y+h/2-h*r/2,nw,h*r]); return; }
    if(drag){ if(!drag.moved&&Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)<5) return; drag.moved=true;
      const p=svgPt(ev); place(drag.it,p.x-drag.ox,p.y-drag.oy); drawItems(); return; }
    if(pan){ const dx=(ev.clientX-pan.sx)/pan.m, dy=(ev.clientY-pan.sy)/pan.m; if(Math.hypot(dx,dy)>2) pan.moved=true; const [x,y,w,h]=pan.vb; setVb([x-dx,y-dy,w,h]); }
  });
  const up=ev=>{ P.delete(ev.pointerId);
    if(drag){ if(drag.moved){ saveFit(); syncHash(); codeBar(); selBar(); } drag=null; }
    if(pan){ if(!pan.moved&&SEL){ SEL=null; drawItems(); selBar(); } pan=null; }
    if(P.size<2) pinch=null; };
  $('fplan').addEventListener('pointerup',up); $('fplan').addEventListener('pointercancel',up);
  $('fplan').addEventListener('wheel',ev=>{ if(!$('fsvg')) return; ev.preventDefault(); const p=svgPt(ev); zoom(ev.deltaY>0?1.12:1/1.12,p.x,p.y); },{passive:false});

  /* palette: tap to add in view, or drag onto the plan */
  let pd=null;
  $('fpal').addEventListener('pointerdown',ev=>{ const b=ev.target.closest('[data-cat]'); if(!b||ev.pointerType!=='mouse') return; pd={t:+b.dataset.cat,sx:ev.clientX,sy:ev.clientY,moved:false}; });
  document.addEventListener('pointermove',ev=>{ if(pd&&Math.hypot(ev.clientX-pd.sx,ev.clientY-pd.sy)>6){ pd.moved=true; document.body.classList.add('dragging'); } });
  document.addEventListener('pointerup',ev=>{ if(!pd) return; const d=pd; pd=null; document.body.classList.remove('dragging');
    if(!d.moved) return; const s=$('fsvg'); if(!s) return; const r=s.getBoundingClientRect();
    if(ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom){ const p=svgPt(ev); addItem(d.t,p.x,p.y); }
    $('fpal').dataset.skip='1'; });
  $('fpal').addEventListener('click',ev=>{ if($('fpal').dataset.skip){ delete $('fpal').dataset.skip; return; }
    const b=ev.target.closest('[data-cat]'); if(b) addItem(+b.dataset.cat);
    const g=ev.target.closest('[data-cg]'); if(g){ g.parentElement.classList.toggle('shut'); } });

  $('fsel').addEventListener('click',ev=>{
    const it=SEL; if(!it) return; const b=ev.target.closest('[data-a],[data-col]'); if(!b) return;
    if(b.dataset.col){ it.col=b.dataset.col.toUpperCase(); }
    else switch(b.dataset.a){
      case 'rl': it.r=((it.r||0)+270)%360; break;
      case 'rr': it.r=((it.r||0)+90)%360; break;
      case 'r15': it.r=((it.r||0)+15)%360; break;
      case 'w-': case 'w+': case 'd-': case 'd+': { const [w,d]=isz(it), k=b.dataset.a[1]==='+'?10:-10;
        if(b.dataset.a[0]==='w') it.w=Math.max(10,w+k), it.d=d; else it.d=Math.max(2,d+k), it.w=w; break; }
      case 'col': { const p=$('fcol'); p.hidden=!p.hidden; if(!p.hidden) p.innerHTML=colPanel(); return; }
      case 'hex': { const v=($('fhex').value||'').trim().replace(/^#?/,'#').toUpperCase(); if(!/^#[0-9A-F]{6}$/.test(v)){ $('fhex').style.borderColor='var(--warn)'; return; } it.col=v; break; }
      case 'nocol': it.col=null; break;
      case 'dup': { const n=Object.assign({},it); n.x+=20; n.y+=20; ITEMS.push(n); SEL=n; break; }
      case 'del': ITEMS.splice(ITEMS.indexOf(it),1); SEL=null; break;
    }
    saveFit(); syncHash(); drawItems(); selBar(); codeBar();
  });
  document.querySelector('.fbar').addEventListener('click',ev=>{
    const f=ev.target.closest('[data-ff]'); if(f){ FFLOOR=+f.dataset.ff; SEL=null; renderFit(true); return; }
    const a=ev.target.closest('[data-z]'); if(!a) return;
    if(a.dataset.z==='in') zoom(1/1.25); else if(a.dataset.z==='out') zoom(1.25); else if(a.dataset.z==='fit'){ delete FVB[FFLOOR]; renderFit(true); }
    else if(a.dataset.z==='snap'){ SNAP=!SNAP; a.setAttribute('aria-pressed',SNAP); a.textContent=SNAP?'Snap: on':'Snap: off'; }
    else if(a.dataset.z==='clr'){ if(!onFloor(FFLOOR).length) return; if(!confirm('Remove every fitting on the '+FLOORS[FFLOOR].toLowerCase()+'?')) return;
      ITEMS=ITEMS.filter(it=>it.f!==FFLOOR); SEL=null; saveFit(); syncHash(); renderFit(false); }
  });
  $('fimp').addEventListener('change',()=>{ const id=$('fimp').value; $('fimp').value=''; if(!id) return;
    const add=layoutItems(state().c,[id]); ITEMS.push(...add); const fl=add.length?add[0].f:FFLOOR; if(fl!==FFLOOR){ FFLOOR=fl; renderFit(true); } else { saveFit(); syncHash(); renderFit(false); } saveFit(); syncHash(); });
  $('fcode').addEventListener('click',ev=>{ if(ev.target.id!=='fshare') return; syncHash(); const url=location.href, m=$('fmsg');
    try{ navigator.clipboard.writeText(url).then(()=>{ m.textContent='Link copied.'; },()=>{ m.textContent=url; }); }catch(e){ m.textContent=url; } });
  document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(+b.dataset.page)));
  document.addEventListener('keydown',ev=>{ if(PAGE!==2||!SEL||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if(ev.key==='Delete'||ev.key==='Backspace'){ ITEMS.splice(ITEMS.indexOf(SEL),1); SEL=null; }
    else if(ev.key==='r'||ev.key==='R'){ SEL.r=((SEL.r||0)+(ev.shiftKey?270:90))%360; }
    else if(ev.key.startsWith('Arrow')){ const k=ev.shiftKey?10:1; SEL.x+=ev.key==='ArrowLeft'?-k:ev.key==='ArrowRight'?k:0; SEL.y+=ev.key==='ArrowUp'?-k:ev.key==='ArrowDown'?k:0; }
    else return; ev.preventDefault(); saveFit(); syncHash(); drawItems(); selBar(); codeBar(); });
  /* palette */
  $('fpal').innerHTML=CGROUPS.map(g=>`<section class="cgrp"><button type="button" class="cgh" data-cg="${g}">${g}</button><div class="cits">${CAT.map((c,i)=>[c,i]).filter(([c])=>c[1]===g).map(([c,i])=>{
      const s=Math.max(c[3],c[4])+10; return `<button type="button" class="cit" data-cat="${i}" title="${esc(c[2])}"><svg viewBox="${-s/2} ${-s/2} ${s} ${s}" width="34" height="34">${itemSvg({t:i,x:0,y:0,r:0},-1)}</svg><span>${esc(c[2])}<small>${c[3]} × ${c[4]}${c[5]>5?' × '+c[5]:''}</small></span></button>`; }).join('')}</div></section>`).join('');
})();

/* start: code in the address wins, then the last picks in this browser */
(function init(){
  let p=null, fi;
  try{ const fs=JSON.parse(localStorage.getItem(FKEY)||'[]'); if(Array.isArray(fs)) ITEMS=fs.filter(it=>it&&CAT[it.t]); }catch(e){}
  try{ if(location.hash.length>1){ const [sc,fc]=decodeURIComponent(location.hash.slice(1)).split('~'); p=readCode(sc); if(p&&fc!=null){ fi=readFit(fc)||undefined; } } }catch(e){}
  if(!p){ try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&typeof s==='object'&&exists(s)) p=s; }catch(e){} }
  applyPicks(p||{},true,fi);
  let pg=1; try{ pg=+localStorage.getItem('lindens-page')||1; }catch(e){} if(pg===2&&state().complete) setPage(2);
})();
</script>

</body></html>
